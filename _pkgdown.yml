url: https://prigasg.github.io/explodemap/
development:
  mode: auto
template:
  bootstrap: 5
  bootswatch: flatly
  bslib:
    primary: '#2166ac'
    border-radius: 0.25rem
    btn-border-radius: 0.25rem
home:
  title: explodemap
  description: |
    Tools for hierarchical exploded-view cartography of dense administrative boundary data. The package supports deterministic two-level exploded maps, grouped multi-region layouts, analytical parameter derivation, export workflows for downstream mapping, and a live Hugging Face demo at https://huggingface.co/spaces/Prigas89/explodemap-gallery.
  sidebar:
    structure:
    - links
    - license
    - community
    - dev
figures:
  dev: ragg::agg_png
  dpi: 150
  fig.ext: png
navbar:
  structure:
    left:
    - intro
    - reference
    - articles
    - gallery
    - news
    right:
    - demo
    - search
    - github
  components:
    intro:
      text: Get started
      href: articles/getting-started.html
    reference:
      text: Reference
      href: reference/index.html
    articles:
      text: Articles
      menu:
      - text: Getting started
        href: articles/getting-started.html
      - text: Choosing a workflow
        href: articles/workflow-guide.html
      - text: Grouped layouts and anchor placement
        href: articles/grouped-layouts.html
      - text: State-first composition with dragmapr
        href: articles/state-first-composition.html
      - text: '---'
      - text: Reproducing paper examples and drag helpers
        href: articles/reproducing-paper-examples.html
    gallery:
      text: Interactive Map Gallery
      href: map-gallery/index.html
    news:
      text: News
      href: news/index.html
    demo:
      icon: fas fa-rocket
      text: Live demo
      href: https://huggingface.co/spaces/Prigas89/explodemap-gallery
      aria-label: Live demo on Hugging Face Spaces
    github:
      icon: fab fa-github
      href: https://github.com/PrigasG/explodemap
      aria-label: GitHub
reference:
- title: Core workflow
  desc: |
    Main entry points for generating two-level exploded-view maps from projected sf data or state-level TIGER/Line inputs.
  contents:
  - explode_sf
  - explode_sf_with_lookup
  - explode_state
- title: Interactive focus maps
  desc: |
    htmlwidgets and Shiny helpers for selected-feature focus, labels, and non-blocking information cards.
  contents:
  - explode_section
  - focus_map
  - focus_map_preset
  - focusmapOutput
  - renderFocusmap
  - focusMapProxy
- title: Grouped layouts
  desc: |
    Functions for three-level grouped layouts with anchor placement and optional collision-aware refinement.
  contents:
  - explode_grouped
  - layout_regions
  - estimate_block_radii
- title: State-first composition (dragmapr bridge)
  desc: |
    Hand a computed layout to the dragmapr editor as a reusable dragmapr_state, then apply edited compositions back. as_dragmapr_state() is the preferred handoff; the resulting state is accepted by focus_map(), render_dragged_map(), and update_exploded_layout(). as_dragmapr() is the legacy low-level handoff.
  contents:
  - as_dragmapr_state
  - update_exploded_layout
  - as_dragmapr
- title: Input preparation and app primitives
  desc: |
    Reusable validation, simplification, grouping, palette, and fingerprint
    helpers that support Shiny apps, examples, and preprocessing pipelines.
  contents:
  - validate_explodemap_input
  - prepare_explodemap_input
  - count_geometry_vertices
  - simplify_to_vertex_budget
  - assign_spatial_groups
  - group_palette
  - explodemap_fingerprint
- title: Layout quality and optimization
  desc: |
    Score a grouped layout and search for better region placements.
  contents:
  - diagnose_layout
  - plot.layout_quality_report
  - layout_objective
  - optimize_grouped_layout
- title: Statistics and calibration
  desc: |
    Tools for computing geometry statistics, deriving parameters, and building calibration summaries across datasets.
  contents:
  - compute_stats
  - derive_params
  - calibration_row
- title: Export and cache helpers
  desc: |
    Optional export helpers and cache management utilities.
  contents:
  - export_topojson
  - apply_region_offsets
  - read_drag_offsets
  - cache_list
  - cache_clear
- title: HHS reference maps
  desc: |
    Ready-made U.S. Department of Health and Human Services region layouts, palettes, and a one-call focus map for HHS-style placeholder shapes.
  contents:
  - hhs_layout
  - hhs_focus_map
  - as_hhs_states
  - hhs_regions
  - hhs_region_names
  - hhs_display_offsets
  - hhs_palette
- title: Methods
  desc: |
    S3 methods for printing, plotting, summarising, and extracting tabular results from exploded map objects.
  contents:
  - print.exploded_map
  - plot.exploded_map
  - summary.exploded_map
  - print.grouped_exploded_map
  - plot.grouped_exploded_map
  - summary.grouped_exploded_map
articles:
- title: Get started
  navbar: ~
  contents: getting-started
- title: Choosing a workflow
  contents: workflow-guide
- title: Grouped layouts
  contents: grouped-layouts
- title: State-first composition
  contents: state-first-composition
- title: Paper replication and drag helpers
  contents: reproducing-paper-examples
footer:
  structure:
    left: developed_by
    right: built_with

