function dragMove(ev){if(!activeRegion||!activePointer)return;const o=offsets.get(activeRegion);o.px+=ev.clientX-activePointer.x;o.py+=ev.clientY-activePointer.y;activePointer={x:ev.clientX,y:ev.clientY};renderTransforms();}
function endDrag(){document.querySelectorAll(".dragging").forEach(e=>e.classList.remove("dragging"));activeRegion=null;activePointer=null;}
function main(){regionIds=labels.map(d=>String(d.region));featureByRegion=groupFeatures(geojson.features);setupProjectionOnly();root=svgEl("g");svg.appendChild(root);regionGroups=new Map();labelGroups=new Map();for(const region of regionIds){const group=svgEl("g",{class:"region","data-region":region});group.addEventListener("pointerdown",ev=>startDrag(ev,region));for(const feature of featureByRegion.get(region)||[]){const path=svgEl("path",{fill:colorFor(feature.properties.drag_region),d:geometryPath(feature.geometry)});const title=svgEl("title");title.textContent=feature.properties.NAME||feature.properties.drag_region;path.appendChild(title);group.appendChild(path);}root.appendChild(group);regionGroups.set(region,group);}labelLayer=svgEl("g",{class:"labels"});root.appendChild(labelLayer);for(const region of regionIds){const group=svgEl("g",{class:"label","data-region":region});group.addEventListener("pointerdown",ev=>startDrag(ev,region));group.appendChild(svgEl("circle",{r:11}));const text=svgEl("text");text.textContent=String(region).length>4?String(region).slice(0,4):region;group.appendChild(text);labelLayer.appendChild(group);labelGroups.set(region,group);}svg.addEventListener("pointermove",dragMove);svg.addEventListener("pointerup",endDrag);svg.addEventListener("pointerleave",endDrag);renderTransforms();}
window.addEventListener("resize",()=>{if(!geojson)return;setupProjectionOnly();for(const group of regionGroups.values()){for(const pathEl of group.querySelectorAll("path")){const feature=(featureByRegion.get(group.dataset.region)||[])[Array.from(group.querySelectorAll("path")).indexOf(pathEl)];if(feature)pathEl.setAttribute("d",geometryPath(feature.geometry));}}renderTransforms();});
document.querySelector("#reset").addEventListener("click",()=>{for(const r of regionIds)offsets.set(String(r),{px:0,py:0});renderTransforms();});
document.querySelector("#copy").addEventListener("click",async()=>navigator.clipboard.writeText(csvText()));
document.querySelector("#download").addEventListener("click",()=>{const blob=new Blob([csvText()],{type:"text/csv"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=offsetFile;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);});
main();
</script></body></html>
