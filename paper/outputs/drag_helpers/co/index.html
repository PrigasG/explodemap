const bounds={xmin:-50477.58060105999,xmax:948163.4217955961,ymin:3994708.952572909,ymax:4723121.726209807};
const svg=document.getElementById('map');
let W=svg.clientWidth||900,H=svg.clientHeight||650;
let offsets={};labels.forEach(l=>{offsets[l.region]={dx:0,dy:0};});
function project(x,y){return[((x-bounds.xmin)/(bounds.xmax-bounds.xmin))*W,H-((y-bounds.ymin)/(bounds.ymax-bounds.ymin))*H];}
const palette=['#2166ac','#d73027','#1a9850','#984ea3','#ff7f00','#a65628','#f781bf','#999999','#33a02c','#b2df8a'];
const rC={};labels.forEach((l,i)=>{rC[l.region]=palette[i%palette.length];});
function renderAll(){
  while(svg.firstChild)svg.removeChild(svg.firstChild);
  geojson.features.forEach(f=>{
    const region=f.properties.drag_region,off=offsets[region]||{dx:0,dy:0};
    const coords=f.geometry.type==='Polygon'?[f.geometry.coordinates]:f.geometry.coordinates;
    coords.forEach(poly=>poly.forEach(ring=>{
      const path=document.createElementNS('http://www.w3.org/2000/svg','path');
      const pts=ring.map(([x,y])=>{const[px,py]=project(x+off.dx,y+off.dy);return px+','+py;});
      path.setAttribute('d','M'+pts.join('L')+'Z');path.setAttribute('fill',rC[region]||'#aaa');
      path.setAttribute('stroke','#fff');path.setAttribute('stroke-width','0.4');
      path.setAttribute('data-region',region);path.style.cursor='move';svg.appendChild(path);
    }));
  });
  labels.forEach(l=>{
    const off=offsets[l.region]||{dx:0,dy:0};const[px,py]=project(l.x+off.dx,l.y+off.dy);
    const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('cx',px);c.setAttribute('cy',py);c.setAttribute('r',5);
    c.setAttribute('fill','white');c.setAttribute('stroke','#333');c.setAttribute('stroke-width','1');
    c.style.pointerEvents='none';svg.appendChild(c);
    const t=document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('x',px+7);t.setAttribute('y',py+4);t.setAttribute('font-size','11');
    t.setAttribute('fill','#222');t.setAttribute('font-family','sans-serif');
    t.textContent=l.region;t.style.pointerEvents='none';svg.appendChild(t);
  });
}
let dragging=null,sX=0,sY=0,sDX=0,sDY=0;
svg.addEventListener('pointerdown',e=>{
  const el=e.target.closest('[data-region]');if(!el)return;
  dragging=el.getAttribute('data-region');sX=e.clientX;sY=e.clientY;
  const off=offsets[dragging]||{dx:0,dy:0};sDX=off.dx;sDY=off.dy;
  svg.setPointerCapture(e.pointerId);e.preventDefault();
});
svg.addEventListener('pointermove',e=>{
  if(!dragging)return;
  const sx=(bounds.xmax-bounds.xmin)/W,sy=(bounds.ymax-bounds.ymin)/H;
  offsets[dragging]={dx:sDX+(e.clientX-sX)*sx,dy:sDY-(e.clientY-sY)*sy};renderAll();
});
svg.addEventListener('pointerup',()=>{dragging=null;});
function csvText(){
  const esc=v=>{const t=String(v);return /[",\n]/.test(t)?'"'+t.replaceAll('"','""')+'"':t;};
  const rows=[['region','dx_m','dy_m']];
  labels.forEach(l=>{const off=offsets[l.region]||{dx:0,dy:0};rows.push([l.region,Math.round(off.dx),Math.round(off.dy)]);});
  return rows.map(r=>r.map(esc).join(',')).join('\n');
}
document.getElementById('export-btn').addEventListener('click',()=>{
  const blob=new Blob([csvText()],{type:'text/csv'});const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='co_drag_offsets.csv';a.click();
});
document.getElementById('reset-btn').addEventListener('click',()=>{
  labels.forEach(l=>{offsets[l.region]={dx:0,dy:0};});renderAll();
});
window.addEventListener('resize',()=>{W=svg.clientWidth;H=svg.clientHeight;renderAll();});
renderAll();
