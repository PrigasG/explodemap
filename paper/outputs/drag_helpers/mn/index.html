.app { display: grid; grid-template-columns: minmax(0,1fr) 340px; min-height: 100vh; }

.buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
button { border: 1px solid #d8dee8; background: #f7f8fb; color: #172033; border-radius: 6px; min-height: 36px; font: inherit; cursor: pointer; }
textarea { width: 100%; height: 360px; resize: vertical; border: 1px solid #d8dee8; border-radius: 6px; padding: 10px; font: 12px/1.35 ui-monospace,SFMono-Regular,Consolas,monospace; }

const bounds = {xmin: 98559.58126358324, xmax: 903426.1077600196, ymin: 4659368.701678393, ymax: 5613975.548510681};
const offsetFile = "mn_drag_offsets.csv";
const palette = ["#2166ac","#d73027","#1a9850","#984ea3","#ff7f00","#a65628","#f781bf","#999999","#33a02c","#b2df8a","#66c2a5","#fc8d62","#8da0cb","#e78ac3","#a6d854"];
const svg = document.querySelector("#map");
const offsets = new Map(labels.map(d => [String(d.region), {px: 0, py: 0}]));
let regionIds, featureByRegion, m, root, regionGroups, labelGroups, labelLayer;
let activeRegion = null, activePointer = null;

function measure() {
  const W = svg.clientWidth || 900, H = svg.clientHeight || 700, pad = 38;
  const sx = (W-pad*2)/(bounds.xmax-bounds.xmin), sy = (H-pad*2)/(bounds.ymax-bounds.ymin);
  const scale = Math.min(sx, sy);
  return {width:W, height:H, scale,
          tx: pad+(W-pad*2-(bounds.xmax-bounds.xmin)*scale)/2-bounds.xmin*scale,
          ty: pad+(H-pad*2+(bounds.ymax-bounds.ymin)*scale)/2+bounds.ymin*scale};
}
function setupProjectionOnly() { m = measure(); svg.setAttribute("viewBox",`0 0 ${m.width} ${m.height}`); }
function project(c) { return [c[0]*m.scale+m.tx, -c[1]*m.scale+m.ty]; }
function ringPath(ring) {
  if (!ring.length) return "";
  const f = project(ring[0]);
  return `M${f[0].toFixed(2)},${f[1].toFixed(2)}` +
         ring.slice(1).map(c => { const p=project(c); return `L${p[0].toFixed(2)},${p[1].toFixed(2)}`; }).join("") + "Z";
}
function geometryPath(g) {
  if (!g) return "";
  if (g.type === "Polygon") return g.coordinates.map(ringPath).join("");
  if (g.type === "MultiPolygon") return g.coordinates.flatMap(p => p.map(ringPath)).join("");
  return "";
}
function projectedLabel(r) { const l = labels.find(d => String(d.region)===String(r)); return project([l.x, l.y]); }
function transformFor(r) { const o = offsets.get(String(r)); return `translate(${o.px},${o.py})`; }
function csvText() {
  const lines = ["region,dx_m,dy_m"];
  for (const r of regionIds) {
    const o = offsets.get(String(r));
    const esc = v => { const t = String(v); return /[",\n]/.test(t) ? `"${t.replaceAll('"','""')}"` : t; };
    lines.push(`${esc(r)},${Math.round(o.px/m.scale)},${Math.round(-o.py/m.scale)}`);
  }
  return lines.join("\n");
}
function updateCsv() { document.querySelector("#csv").value = csvText(); }
function renderTransforms() {
  for (const [r,g] of regionGroups.entries()) g.setAttribute("transform", transformFor(r));
  for (const [r,g] of labelGroups.entries()) {
    const p = projectedLabel(r), o = offsets.get(String(r));
    g.setAttribute("transform", `translate(${p[0]+o.px},${p[1]+o.py})`);
  }
  updateCsv();
}
function colorFor(r) { return palette[Math.abs(Array.from(String(r)).reduce((a,c)=>a+c.charCodeAt(0),0))%palette.length]; }
function svgEl(n, a={}) { const e=document.createElementNS("http://www.w3.org/2000/svg",n); for(const[k,v]of Object.entries(a))e.setAttribute(k,v); return e; }
function groupFeatures(features) {
  const m = new Map();
  for (const f of features) { const r=String(f.properties.drag_region); if(!m.has(r))m.set(r,[]); m.get(r).push(f); }
  return m;
}
function startDrag(ev, region) {
  activeRegion = String(region); activePointer = {x: ev.clientX, y: ev.clientY};
  ev.currentTarget.classList.add("dragging");
  ev.currentTarget.setPointerCapture?.(ev.pointerId);
  labelLayer.parentNode.appendChild(labelLayer);
}
function dragMove(ev) {
  if (!activeRegion || !activePointer) return;
  const o = offsets.get(activeRegion);
  o.px += ev.clientX - activePointer.x; o.py += ev.clientY - activePointer.y;
  activePointer = {x: ev.clientX, y: ev.clientY};
  renderTransforms();
}
function endDrag() { document.querySelectorAll(".dragging").forEach(e=>e.classList.remove("dragging")); activeRegion=null; activePointer=null; }
function main() {
  regionIds = labels.map(d => String(d.region));
  featureByRegion = groupFeatures(geojson.features);
  setupProjectionOnly();
  root = svgEl("g"); svg.appendChild(root);
  regionGroups = new Map(); labelGroups = new Map();
  for (const region of regionIds) {
    const group = svgEl("g", {class:"region","data-region":region});
    group.addEventListener("pointerdown", ev => startDrag(ev, region));
    for (const feature of featureByRegion.get(region) || []) {
      const path = svgEl("path", {fill:colorFor(feature.properties.drag_region), d:geometryPath(feature.geometry)});
      const title = svgEl("title"); title.textContent = feature.properties.NAME || feature.properties.drag_region;
      path.appendChild(title); group.appendChild(path);
    }
    root.appendChild(group); regionGroups.set(region, group);
  }
  labelLayer = svgEl("g", {class:"labels"}); root.appendChild(labelLayer);
  for (const region of regionIds) {
    const group = svgEl("g", {class:"label","data-region":region});
    group.addEventListener("pointerdown", ev => startDrag(ev, region));
    group.appendChild(svgEl("circle", {r:11}));
    const text = svgEl("text"); text.textContent = String(region).length > 4 ? String(region).slice(0,4) : region;
    group.appendChild(text); labelLayer.appendChild(group); labelGroups.set(region, group);
  }
  svg.addEventListener("pointermove", dragMove);
  svg.addEventListener("pointerup",   endDrag);
  svg.addEventListener("pointerleave",endDrag);
  renderTransforms();
}
window.addEventListener("resize", () => {
  if (!geojson) return; setupProjectionOnly();
  for (const group of regionGroups.values()) {
    for (const pathEl of group.querySelectorAll("path")) {
      const feature = (featureByRegion.get(group.dataset.region)||[])[Array.from(group.querySelectorAll("path")).indexOf(pathEl)];
      if (feature) pathEl.setAttribute("d", geometryPath(feature.geometry));
    }
  }
  renderTransforms();
});
document.querySelector("#reset").addEventListener("click", () => {
  for (const r of regionIds) offsets.set(String(r), {px:0,py:0}); renderTransforms();
});
document.querySelector("#copy").addEventListener("click", async () => navigator.clipboard.writeText(csvText()));
document.querySelector("#download").addEventListener("click", () => {
  const blob = new Blob([csvText()], {type:"text/csv"});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement("a"); a.href=url; a.download=offsetFile;
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
});
main();
